# Workflow schema version.
version: 1
kind: workflow-template

template:
  # External Jinja2 OpenNebula template.
  source: vm-template.one.j2

cloud_init:
  # Inline Jinja2 cloud-init body (alternative to cloud_init.source).
  inline: |
    #cloud-config
    package_update: true
    write_files:
      - path: /etc/openclaw.env
        permissions: "0600"
        content: |
    {% for key, value in bootstrap_env.items() %}
            {{ key }}={{ value }}
    {% endfor %}
    runcmd:
      - [ bash, -lc, "echo inline cloud-init for {{ template_name }}" ]

defaults:
  # Baseline sizing for user-specific OpenClaw workers.
  cpu: 2
  memory_mb: 4096
  disk_size_mb: 30720
  network_name: Private

required:
  - template_name
  - image_name
