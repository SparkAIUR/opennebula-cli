family: vnet
script: onevnet
version: "7.0"
commands:
  list:
    aliases: []
    handler: rpc
    backend_method: one.vnpool.info
    supports_wait: false
    outputs: [table, json, yaml, xml, csv, raw]
    args: []
    options: []
    parity:
      status: implemented
      source: official-cli
      notes: Read-only Wave 2 list support.
  show:
    aliases: []
    handler: rpc
    backend_method: one.vn.info
    supports_wait: false
    outputs: [table, json, yaml, xml, raw]
    args:
      - name: vnet_id
        type: int
    options: []
    parity:
      status: implemented
      source: official-cli
      notes: Uses XML-RPC info with decrypt disabled.
  create:
    aliases: []
    handler: rpc
    backend_method: one.vn.allocate
    supports_wait: false
    outputs: [table, json, yaml, xml, raw]
    args: []
    options: []
    parity:
      status: cataloged
      source: official-cli
  delete:
    aliases: []
    handler: rpc
    backend_method: one.vn.delete
    supports_wait: false
    outputs: [table, json, yaml, xml, raw]
    args:
      - name: vnet_id
        type: int
    options: []
    parity:
      status: cataloged
      source: official-cli
