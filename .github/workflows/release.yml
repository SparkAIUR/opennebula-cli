name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync
        run: uv sync --group dev
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
