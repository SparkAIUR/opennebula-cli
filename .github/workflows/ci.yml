name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Catalog validation
        run: uv run python tools/check_catalog_schema.py
      - name: Pytest
        run: uv run pytest
      - name: Build
        run: uv build
